name: Tallynest Build Verification
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/tallynest-build.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tallynest
      REDIS_URL: redis://localhost:6379
      WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: tallynest-ci-secret-tallynest-ci-secret
      CRON_SECRET: tallynest-ci-cron
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CUBEJS_API_SECRET: tallynest-ci-cube-secret
      CUBEJS_API_URL: http://localhost:4000
      HUB_API_URL: http://localhost:3001
      HUB_API_KEY: tallynest-ci-hub-key
      LOG_LEVEL: silent
      FORMBRICKS_APP_URL: http://localhost:3000
      IS_FORMBRICKS_CLOUD: "false"
      NEXT_PUBLIC_IS_FORMBRICKS_CLOUD: "false"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate
        run: pnpm generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Verify Enterprise source boundary
        run: |
          test ! -d apps/web/modules/ee
          if git grep -n "modules/ee/" -- ':!EE-DEPENDENCY-REPORT.md' ':!.github/workflows/tallynest-core-boundary.yml' ':!LICENSING-AUDIT.md' ':!THIRD-PARTY-NOTICES.md' ':!CHANGES.md' ':!ARCHITECTURE.md' ':!LICENSE' ':!README.md'; then
            echo "Enterprise references remain"
            exit 1
          fi
