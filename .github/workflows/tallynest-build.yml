name: Tallynest Build Verification

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vercel.json"
      - ".github/workflows/tallynest-build.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tallynest
      REDIS_URL: redis://localhost:6379
      WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: tallynest-ci-secret-tallynest-ci-secret
      CRON_SECRET: tallynest-ci-cron
      LOG_LEVEL: silent
      FORMbricks_APP_URL: http://localhost:3000
      FORMBRICKS_APP_URL: http://localhost:3000
      IS_FORMBRICKS_CLOUD: "false"
      NEXT_PUBLIC_IS_FORMBRICKS_CLOUD: "false"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate
        run: pnpm generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Assert Enterprise source absent
        run: |
          test ! -d apps/web/modules/ee
          ! git grep -n -E "from [\"'']@/modules/ee/|modules/ee/" -- ':!EE-DEPENDENCY-REPORT.md' ':!.github/workflows/tallynest-core-boundary.yml' ':!LICENSING-AUDIT.md' ':!THIRD-PARTY-NOTICES.md' ':!CHANGES.md' ':!ARCHITECTURE.md' ':!LICENSE' ':!README.md'
