name: Tallynest bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[tallynest-bootstrap-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout empty Tallynest history
        uses: actions/checkout@v4

      - name: Import permitted upstream source without Git history
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch main https://github.com/formbricks/formbricks.git "$tmp/formbricks"
          upstream_sha="$(git -C "$tmp/formbricks" rev-parse HEAD)"
          printf '%s\n' "$upstream_sha" > .tallynest-source.txt

          # Copy working-tree content only. This is deliberately NOT a fork and does not copy .git.
          rsync -a             --exclude='.git'             --exclude='apps/web/modules/ee/'             --exclude='.github/'             --exclude='LICENSE'             --exclude='README.md'             --exclude='LICENSING-AUDIT.md'             --exclude='THIRD-PARTY-NOTICES.md'             --exclude='CHANGES.md'             --exclude='ARCHITECTURE.md'             --exclude='.env.example'             "$tmp/formbricks/" ./

          # Remove the Enterprise Edition again after rsync as a hard boundary check.
          rm -rf apps/web/modules/ee

          # Remove upstream cloud/enterprise activation examples from the Tallynest environment template.
          if [ -f .env.example ]; then
            sed -i '/ENTERPRISE_LICENSE_KEY/d' .env.example
            sed -i 's/Formbricks/Tallynest/g' .env.example
          fi

          # Rebrand only user-facing documentation/configuration text. Do not globally replace
          # internal @formbricks package names or copyright/license notices.
          while IFS= read -r -d '' f; do
            sed -i 's/Formbricks/Tallynest/g' "$f"
            sed -i 's/formbricks\\.com/tallynest.example/g' "$f"
          done < <(find docs -type f \( -name '*.md' -o -name '*.mdx' \) -print0 2>/dev/null || true)

          # Replace obvious application metadata without changing internal package namespaces.
          if [ -f apps/web/app/layout.tsx ]; then
            sed -i 's/| Formbricks/| Tallynest/g; s/default: "Formbricks"/default: "Tallynest"/g' apps/web/app/layout.tsx || true
          fi

          # Root package identity.
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.name="tallynest"; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");'

          # Remove upstream CI/config that could publish Formbricks artifacts or assume Formbricks secrets.
          rm -rf .github/workflows
          mkdir -p .github/workflows

          # Hard licensing boundary: no EE source may remain.
          if find . -path './.git' -prune -o -path './node_modules' -prune -o -path './apps/web/modules/ee' -print -quit | grep -q .; then
            echo "Enterprise Edition source boundary violated"
            exit 1
          fi

          # Do not silently retain the Enterprise license key in source configuration.
          if git grep -n 'ENTERPRISE_LICENSE_KEY' -- ':!LICENSING-AUDIT.md' ':!THIRD-PARTY-NOTICES.md' 2>/dev/null; then
            echo "Enterprise license configuration remains in source; review and remove it."
            exit 1
          fi

          rm -rf "$tmp"

          # Control documents are already present in the target repository and are not overwritten by rsync.\n          touch .tallynest-bootstrap-complete\n
      - name: Install dependencies
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate && pnpm install --frozen-lockfile

      - name: Static licensing boundary check
        run: |
          set -euo pipefail
          test ! -d apps/web/modules/ee
          if git grep -n 'modules/ee' -- ':!LICENSING-AUDIT.md' ':!CHANGES.md' ':!ARCHITECTURE.md' ':!LICENSE' ':!README.md' ':!THIRD-PARTY-NOTICES.md'; then
            echo "Remaining EE import/reference detected. This must be independently replaced or removed."
            exit 1
          fi

      - name: Commit imported Tallynest core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tallynest Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          HUSKY=0 git commit -m "Initial Tallynest core [tallynest-bootstrap-complete]"
          git push origin HEAD:main

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          printf '\nDATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/tallynest?schema=public\n' >> .env
          printf '\nDIRECT_URL=postgresql://postgres:postgres@127.0.0.1:5432/tallynest?schema=public\n' >> .env
          printf '\nNEXTAUTH_SECRET=ci-placeholder-nextauth-secret\n' >> .env
          printf '\nENCRYPTION_KEY=ci-placeholder-encryption-key-32-chars\n' >> .env
          printf '\nAUTH_SECRET=ci-placeholder-auth-secret\n' >> .env

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

