name: Normalize Tallynest core boundary
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/normalize-core-boundary.mjs"
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize
        run: node scripts/normalize-core-boundary.mjs
      - name: Commit
        run: |
          git config user.name "tallynest-bot"
          git config user.email "41898282+tallynest-bot@users.noreply.github.com"
          git add apps/web
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize core activity wrapper imports"
          git push
