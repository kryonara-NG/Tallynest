name: Tallynest verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[tallynest-verify-report]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate && pnpm install --frozen-lockfile

      - name: Audit Enterprise dependency references
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# EE Dependency Report"
            echo
            echo "Generated from the Tallynest working tree. No Formbricks Enterprise source is permitted."
            echo
            if git grep -n -E 'modules/ee|/ee/' -- apps/web packages; then
              echo
              echo "**Action required:** each listed dependency must be removed or replaced with independently authored Tallynest code."
            else
              echo "No Enterprise-module references detected."
            fi
          } > EE-DEPENDENCY-REPORT.md

          # Audit is report-only in verification; extraction workflow owns the committed report.\n          # Keep the audit visible but continue into compiler/test/build stages.

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          printf '\nDATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/tallynest?schema=public\n' >> .env
          printf '\nDIRECT_URL=postgresql://postgres:postgres@127.0.0.1:5432/tallynest?schema=public\n' >> .env
          printf '\nNEXTAUTH_SECRET=ci-placeholder-nextauth-secret\n' >> .env
          printf '\nENCRYPTION_KEY=ci-placeholder-encryption-key-32-chars\n' >> .env
          printf '\nAUTH_SECRET=ci-placeholder-auth-secret\n' >> .env

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build
